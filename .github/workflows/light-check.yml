# Runs tools/light_check.py — this repo's own sanity net beyond
# BestPractice's doc_lint.py — on every push and pull request, so it
# binds every path to the default branch, not just sessions that remember to
# run it before committing (same reasoning as BestPractice's own
# doc-lint.yml.template).
name: Light check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  light-check:
    name: Light check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional YAML support
        run: python -m pip install pyyaml

      - name: Run light check
        run: python3 tools/light_check.py
